[project]
name = "rena-task-grammar"
version = "0.1.0"
description = "The canonical task-string grammar, shared by every producer and reader"
requires-python = ">=3.10"
# Deliberately empty, and it is the whole point of this package existing. The grammar
# is consumed by a zip Lambda, two container images, the training boxes and the policy
# server; anything declared here has to be installable in all of them. It lived in
# rena-s3sync until 2026-08-19, where `import boto3` at the top of that package's
# __init__ made it unimportable in the serving venv -- a module can only be as
# dependency-free as the package that contains it.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rena_task_grammar"]
